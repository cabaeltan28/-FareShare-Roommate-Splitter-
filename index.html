<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FareShare 🛒</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>🛒 FareShare</h2>
  <p>Split groceries. No drama.</p>
</header>

<div class="container">


  <div class="input-group">
    <input type="text" id="membersInput"
      placeholder="Enter members separated by comma">
    <button onclick="setMembers()">Set Members</button>
  </div>

 
  <div class="input-group">
    <input type="text" id="itemName" placeholder="Item">
    <input type="number" id="itemPrice" placeholder="Price">
  </div>

  <div class="input-group">
  <div id="payerOptions" class="payer-options"></div>
  <button onclick="addItem()">Add</button>
</div>

 
  <div class="receipt">
    <h3>🧾 Receipt</h3>

    <div id="items"></div>

    <div class="columns" id="memberColumns"></div>

    <div class="totals" id="totals"></div>
  </div>

</div>

<script src="js.js"></script>

</body>
</html>
